name: Xbox Series S UWP CI

on:
  push:
    branches:
      - 'xbox-series-s-uwp-d3d12'
      - 'master'
      - 'main'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  BUILD_CONFIG: Release
  VCPKG_DEFAULT_BINARY_CACHE: "C:/vcpkg-cache"

jobs:
  build-xbox-uwp:
    name: Build Xbox Series S UWP (D3D12)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg-cache
            C:\vcpkg\installed
          key: vcpkg-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-x64-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $env:VCPKG_DEFAULT_BINARY_CACHE = "C:\vcpkg-cache"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$vcpkgRoot\vcpkg.exe" install --triplet x64-windows-static-md

      - name: Configure CMake for Xbox UWP
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $vcpkgToolchain = "$vcpkgRoot/scripts/buildsystems/vcpkg.cmake"
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
            -DVCPKG_TARGET_TRIPLET="x64-windows-static-md" `
            -DVCPKG_DEFAULT_BINARY_CACHE="C:/vcpkg-cache" `
            -DCMAKE_BUILD_TYPE=Release `
            -DSPIRV_CROSS_ENABLE_HLSL=ON `
            -DVITA3K_UWP=ON

      - name: Build Vita3K UWP (Detailed MSVC Logs)
        shell: pwsh
        run: |
          cmake --build build --config Release -- /m:2 /verbosity:minimal /fl "/flp:logfile=build_detailed.log"

      - name: Upload Detailed Build & Compiler Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xbox-uwp-build-logs
          path: |
            build_detailed.log
            build/build_detailed.log
            build/**/*.log
          if-no-files-found: ignore

      - name: Stage Appx Layout
        shell: pwsh
        run: |
          $staging = "build/appx_layout"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          
          # Copy binary outputs
          $exe = Get-ChildItem -Path "build" -Filter "Vita3K.exe" -Recurse | Select-Object -First 1
          if ($exe) {
              Write-Host "Found executable at $($exe.FullName)"
              Copy-Item "$($exe.DirectoryName)/*" -Destination $staging -Recurse -Force
          } else {
              Write-Error "Vita3K.exe not found in build directory!"
          }
          
          # Copy Manifest and Assets
          Copy-Item "vita3k/uwp/Package.appxmanifest" -Destination "$staging/AppxManifest.xml" -Force
          New-Item -ItemType Directory -Force -Path "$staging/Assets" | Out-Null
          Copy-Item "vita3k/uwp/Assets/*" -Destination "$staging/Assets" -Force
          
          # Bundle MSVC C++ Runtime & D3DCompiler DLLs for standalone execution on Xbox Dev Mode
          Write-Host "--- Bundling App-Local Runtime Dependencies for Xbox Dev Mode ---"
          $crtDlls = Get-ChildItem -Path "C:\Windows\System32" -Filter "*.dll" | Where-Object { $_.Name -match "^(vcruntime140|msvcp140|d3dcompiler_47)" }
          foreach ($dll in $crtDlls) {
              Write-Host "Bundled: $($dll.Name) ($($dll.Length) bytes)"
              Copy-Item $dll.FullName -Destination $staging -Force
          }
          $vsRedist = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*Microsoft.VC143.CRT*" }
          if ($vsRedist) {
              foreach ($dll in $vsRedist) {
                  Write-Host "Bundled from VS Redist: $($dll.Name)"
                  Copy-Item $dll.FullName -Destination $staging -Force
              }
          }
          $d3d = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "d3dcompiler_47.dll" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if ($d3d) {
              Write-Host "Bundled Windows SDK D3DCompiler: $($d3d.FullName)"
              Copy-Item $d3d.FullName -Destination $staging -Force
          }
          Write-Host "All bundled DLLs in package layout:"
          Get-ChildItem -Path $staging -Filter "*.dll" | ForEach-Object { Write-Host "  -> $($_.Name) ($($_.Length) bytes)" }

          # Copy data and shaders
          if (Test-Path "vita3k/shaders-builtin") {
              Copy-Item "vita3k/shaders-builtin" -Destination "$staging/shaders-builtin" -Recurse -Force
          }
          if (Test-Path "data") {
              Copy-Item "data" -Destination "$staging/data" -Recurse -Force
          }

          # Inspect and Enforce PE Subsystem and AppContainer Characteristics for Xbox Dev Mode
          $stagedExe = "$staging/Vita3K.exe"
          Write-Host "--- Inspecting Staged Vita3K.exe PE Header ---"
          $bytes = [System.IO.File]::ReadAllBytes($stagedExe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToInt16($bytes, $peOffset + 24 + 68)
          $dllChar = [BitConverter]::ToInt16($bytes, $peOffset + 24 + 70)
          Write-Host "PE Subsystem: $subsystem (2 = Windows GUI, 3 = Console)"
          Write-Host "DllCharacteristics: 0x$($dllChar.ToString('X4'))"
          $hasAppContainer = ($dllChar -band 0x1000) -ne 0
          Write-Host "AppContainer flag (0x1000): $hasAppContainer"

          # Enforce with editbin if necessary to ensure 100% Xbox compliance
          if ($subsystem -ne 2 -or -not $hasAppContainer) {
              Write-Host "Enforcing /APPCONTAINER and /SUBSYSTEM:WINDOWS on $stagedExe using editbin..."
              & editbin.exe /APPCONTAINER /SUBSYSTEM:WINDOWS $stagedExe
              # Re-verify
              $bytes = [System.IO.File]::ReadAllBytes($stagedExe)
              $subsystem = [BitConverter]::ToInt16($bytes, $peOffset + 24 + 68)
              $dllChar = [BitConverter]::ToInt16($bytes, $peOffset + 24 + 70)
              Write-Host "Verified Subsystem after editbin: $subsystem"
              Write-Host "Verified DllCharacteristics after editbin: 0x$($dllChar.ToString('X4'))"
          }

          Get-ChildItem -Path $staging

      - name: Create Test Certificate and Pack MSIX
        shell: pwsh
        run: |
          $certPath = "build/Vita3K_TestCert.cer"
          $pfxPath = "build/Vita3K_TestCert.pfx"
          $password = ConvertTo-SecureString -String "Vita3KPassword123!" -Force -AsPlainText
          
          # Generate test certificate matching Package.appxmanifest
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=Vita3K-UWP" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Vita3K Xbox Test Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          
          Export-Certificate -Cert $cert -FilePath $certPath
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password
          
          # Locate MakeAppx and SignTool in Windows SDK (latest x64)
          $sdkBin = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "MakeAppx.exe" -Recurse | Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1).DirectoryName
          Write-Host "Found Windows SDK tools at: $sdkBin"
          
          # Pack MSIX
          & "$sdkBin\MakeAppx.exe" pack /d "build/appx_layout" /p "build/Vita3K-UWP.msix" /o /v
          
          # Sign MSIX
          & "$sdkBin\SignTool.exe" sign /fd SHA256 /f $pfxPath /p "Vita3KPassword123!" "build/Vita3K-UWP.msix"

      - name: Upload Xbox Series S MSIX Package
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-Xbox-Series-S-UWP
          path: |
            build/Vita3K-UWP.msix
            build/Vita3K_TestCert.cer
